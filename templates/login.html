<!doctype html>
<html lang="es">
  <head>
    <title>Equipo SECURITY — Login</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #dfb0bb;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .card {
        background: #ffc5d3;
        padding: 2rem;
        border-radius: 8px;
        width: 340px;
        box-shadow: 0 8px 24px rgrgba(26, 17, 17, 0.3);
      }

      h1 {
        color: #c24e69;
        text-align: center;
        margin-bottom: 1.5rem;
        font-size: 1.4rem;
      }

      label {
        display: block;
        margin-bottom: 0.3rem;
        color: #5d6d7e;
        font-size: 0.9rem;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 0.6rem 0.8rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 1rem;
        font-size: 1rem;
      }
      input[type="text"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: #2e5fa3;
      }

      button {
        width: 100%;
        padding: 0.75rem;
        background: #458447;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #4caf50;
      }

      .message {
        padding: 0.6rem 0.8rem;
        border-radius: 4px;
        margin-bottom: 1rem;
        font-size: 0.9rem;
      }
      .error {
        background: #fdecea;
        color: #c0392b;
        border-left: 4px solid #c0392b;
      }
      .success {
        background: #eafaf1;
        color: #27ae60;
        border-left: 4px solid #27ae60;
      }
      .info {
        background: #d0e4f7;
        color: #1b2a4a;
        border-left: 4px solid #1b2a4a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Equipo SECURITY</h1>

      {% with messages = get_flashed_messages(with_categories=true) %} 
        {% for category, message in messages %}
          <div class="message {{ category }}">{{ message }}</div>
        {% endfor %} 
      {% endwith %}

      <form method="post">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          maxlength="50"
          required
          autocomplete="off"
        />

        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          maxlength="50"
          required
        />

        <button type="submit">Ingresar</button>
      </form>
    </div>
  </body>
</html>
